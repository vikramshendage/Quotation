<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login – Transformer Orders</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 0;
}

/* ---------- LOGIN ---------- */
#loginBox {
  width: 350px;
  margin: 120px auto;
  background: white;
  padding: 25px;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#loginBox h2 {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

button {
  padding: 10px;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}

.login-btn {
  width: 100%;
  background: #2c3e50;
  color: white;
}

.error {
  color: red;
  text-align: center;
  margin-top: 10px;
}

/* ---------- ADMIN PANEL ---------- */
#adminPanel {
  display: none;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #2c3e50;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  font-size: 13px;
  text-align: center;
}

th {
  background: #34495e;
  color: white;
}

.status-new {
  color: #e67e22;
  font-weight: bold;
}

.status-marked {
  color: #27ae60;
  font-weight: bold;
}

.btn-delete {
  background: #e74c3c;
  color: white;
  margin: 2px;
}

.btn-mark {
  background: #2ecc71;
  color: white;
  margin: 2px;
}

.logout {
  float: right;
  background: #555;
  color: white;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN PAGE -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button class="login-btn" onclick="login()">Login</button>
  <div id="error" class="error"></div>
</div>

<!-- 📊 ADMIN PANEL -->
<div id="adminPanel">
  <button class="logout" onclick="logout()">Logout</button>
  <h1>Transformer Orders – Admin Panel</h1>

  <table>
    <thead>
      <tr>
        <th>First</th><th>Last</th><th>Email</th><th>Phone</th>
        <th>Company</th><th>Type</th><th>Power</th>
        <th>Primary</th><th>Secondary</th><th>Qty</th>
        <th>Specifications</th><th>Timestamp</th><th>Status</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
/* 🔐 ADMIN CREDENTIALS (CHANGE THESE) */
const ADMIN_USER = "admin";
const ADMIN_PASS = "12345";

/* 🔗 GOOGLE APPS SCRIPT URL */
const API_URL = "https://script.google.com/macros/s/AKfycbx1NH3Ge3aJHGAKSFc8XGLWtKR8mrpQy6hDRrvw2gO0ei6GV6fFOxp-PtMxhTOGM-j7/exec";

/* ---------- LOGIN ---------- */
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem("loggedIn", "true");
    showAdmin();
  } else {
    document.getElementById("error").innerText = "Invalid username or password";
  }
}

/* ---------- LOGOUT ---------- */
function logout() {
  sessionStorage.removeItem("loggedIn");
  location.reload();
}

/* ---------- SHOW ADMIN PANEL ---------- */
function showAdmin() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  loadData();
}

/* ---------- FETCH DATA ---------- */
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.forEach((row, index) => {
        const tr = document.createElement("tr");

        row.forEach((cell, i) => {
          const td = document.createElement("td");
          td.innerText = cell || "";

          if (i === row.length - 1) {
            td.className = cell === "MARKED" ? "status-marked" : "status-new";
          }

          tr.appendChild(td);
        });

        const actionTd = document.createElement("td");

        const delBtn = document.createElement("button");
        delBtn.innerText = "Delete";
        delBtn.className = "btn-delete";
        delBtn.onclick = () => sendAction("delete", index + 2);

        const markBtn = document.createElement("button");
        markBtn.innerText = "Mark";
        markBtn.className = "btn-mark";
        markBtn.onclick = () => sendAction("mark", index + 2);

        actionTd.append(delBtn, markBtn);
        tr.appendChild(actionTd);

        tbody.appendChild(tr);
      });
    });
}

/* ---------- ACTIONS ---------- */
function sendAction(action, row) {
  if (!confirm("Are you sure?")) return;

  fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: `action=${action}&row=${row}`
  }).then(() => loadData());
}

/* ---------- AUTO LOGIN CHECK ---------- */
if (sessionStorage.getItem("loggedIn") === "true") {
  showAdmin();
}
</script>

</body>
</html>
