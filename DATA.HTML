<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transformer Orders Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #2c3e50;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 20px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  font-size: 13px;
  text-align: center;
}

th {
  background: #34495e;
  color: #fff;
  position: sticky;
  top: 0;
}

tr:nth-child(even) {
  background: #f9f9f9;
}

.status-new {
  color: #e67e22;
  font-weight: bold;
}

.status-marked {
  color: #27ae60;
  font-weight: bold;
}

button {
  padding: 6px 10px;
  margin: 2px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.btn-delete {
  background: #e74c3c;
  color: white;
}

.btn-mark {
  background: #2ecc71;
  color: white;
}
</style>
</head>

<body>

<h1>Transformer Orders – Admin Panel</h1>

<table id="dataTable">
<thead>
<tr>
<th>First</th>
<th>Last</th>
<th>Email</th>
<th>Phone</th>
<th>Company</th>
<th>Type</th>
<th>Power</th>
<th>Primary</th>
<th>Secondary</th>
<th>Qty</th>
<th>Specifications</th>
<th>Timestamp</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx1NH3Ge3aJHGAKSFc8XGLWtKR8mrpQy6hDRrvw2gO0ei6GV6fFOxp-PtMxhTOGM-j7/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {
  const tbody = document.querySelector("tbody");

  data.forEach((row, index) => {
    const tr = document.createElement("tr");

    row.forEach((cell, i) => {
      const td = document.createElement("td");
      td.innerText = cell || "";

      if (i === row.length - 1) {
        if (cell === "MARKED") td.className = "status-marked";
        else td.className = "status-new";
      }

      tr.appendChild(td);
    });

    const actionTd = document.createElement("td");

    const delBtn = document.createElement("button");
    delBtn.innerText = "Delete";
    delBtn.className = "btn-delete";
    delBtn.onclick = () => sendAction("delete", index + 2);

    const markBtn = document.createElement("button");
    markBtn.innerText = "Mark";
    markBtn.className = "btn-mark";
    markBtn.onclick = () => sendAction("mark", index + 2);

    actionTd.append(delBtn, markBtn);
    tr.appendChild(actionTd);

    tbody.appendChild(tr);
  });
});

function sendAction(action, row) {
  if (!confirm(`Are you sure you want to ${action} this record?`)) return;

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `action=${action}&row=${row}`
  }).then(() => location.reload());
}
</script>

</body>
</html>
